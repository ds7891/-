name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '打什么包'
        required: true
        default: 'release'
        type: choice
        options:
          - release        # 正式签名包
          - debug          # 测试包
          - both           # 两个都打
      expected_sha256:
        description: '正式签名的证书 SHA-256 指纹（不符则构建失败）'
        required: false
        default: '2D:57:C2:6A:86:2D:07:E3:38:72:48:E7:87:85:62:DB:09:E7:D7:1A:05:2E:B2:79:D1:C5:5E:24:80:41:20:14'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # material3 模块把 material-color-utilities 子模块的源码目录当作源码，必须递归拉取
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # web 模块的 preBuild 会执行 `pnpm run build`（在 web-ui 目录），必须先装好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # buildWebUi 任务只跑 build 不跑 install，需要提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      # ---------- 正式签名 ----------
      # 两条路任选，不用都配：
      #   A. GitHub Secrets（KEYSTORE_BASE64 等四项）—— keystore 不进仓库
      #   B. 仓库内置 keystore/ 目录 —— 零 Secrets 配置，只要把口令填进 keystore/keystore.properties
      # 两条路都没有时直接拦下，并告诉你要填哪一格，不浪费编译时间。
      - name: Resolve signing keystore
        if: inputs.build_type != 'debug'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -uo pipefail
          : "${RUNNER_TEMP:?runner 未提供 RUNNER_TEMP}"
          mkdir -p "$RUNNER_TEMP"

          # 只判断是否存在，绝不 echo 口令内容
          filled() { [ -n "${1:-}" ]; }
          check_jks() {  # $1=文件  $2=来源标签
            local size magic
            size=$(stat -c%s "$1" 2>/dev/null || echo 0)
            echo "  文件：$1（$size 字节）"
            [ "$size" -gt 0 ] || { echo "::error::$2 解码/读取后为空"; return 1; }
            magic=$(od -An -tx1 -N4 "$1" | tr -d ' \n')
            if [ "$magic" = "feedfeed" ]; then
              echo "  格式：JKS 确认（magic feedfeed）"
            elif [ "${magic:0:2}" = "30" ]; then
              echo "  格式：PKCS12 确认"
            else
              echo "::error::$2 不是合法 keystore，头部字节=$magic（多半是 base64 粘错内容或混入了引号）"
              return 1
            fi
          }

          # 按 JKS 二进制结构直接读第一个条目的 alias（alias 前有 2 字节大端长度），
          # 比扫描可打印字符可靠：不依赖 alias 出现在第几行、周围有没有别的字符串。
          # 解析不出来（比如 PKCS12）就返回空，调用方跳过预检即可。
          jks_alias() {
            python3 -c 'import struct,sys;d=open(sys.argv[1],"rb").read();ok=d[:4]==b"\xfe\xed\xfe\xed" and len(d)>20;a=struct.unpack(">H",d[16:18])[0] if ok else 0;a=a if a>0 and 18+a<=len(d) else 0;sys.stdout.write(d[18:18+a].decode("utf-8","replace") if a else "")' "$1" 2>/dev/null || true
          }

          check_alias() {  # $1=keystore 文件  $2=填写的 alias
            local real
            real=$(jks_alias "$1")
            if [ -z "$real" ]; then
              echo "  alias 预检跳过（非 JKS 或结构解析失败），口令/alias 有误会在签名步骤报出"
            elif [ "$real" = "$2" ]; then
              echo "  keyAlias 与文件内容匹配：$real"
            else
              echo "::error::keyAlias 填错了：你填的是 '$2'，文件里的实际 alias 是 '$real'"
              return 1
            fi
          }


          if filled "$KEYSTORE_BASE64"; then
            echo "=== 签名来源：A · GitHub Secrets ==="
            miss=""
            filled "$KEYSTORE_PASSWORD" || miss="$miss KEYSTORE_PASSWORD"
            filled "$KEY_ALIAS" || miss="$miss KEY_ALIAS"
            filled "$KEY_PASSWORD" || miss="$miss KEY_PASSWORD"
            if [ -n "$miss" ]; then
              echo "::error::已提供 KEYSTORE_BASE64，但还缺:$miss"
              echo "  走 Secrets 方式四项都得有；嫌麻烦可以改用仓库内置方式（见 keystore/README.md）"
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 -di > "$RUNNER_TEMP/release.keystore"
            check_jks "$RUNNER_TEMP/release.keystore" "KEYSTORE_BASE64" || exit 1
            check_alias "$RUNNER_TEMP/release.keystore" "$KEY_ALIAS" || exit 1
            # 只把路径写进 GITHUB_ENV（口令仍由后续步骤的 env 注入，不落盘）
            echo "QINGSHUI_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

          elif [ -f keystore/keystore.properties ] || [ -d keystore ]; then
            echo "=== 签名来源：B · 仓库内置 keystore/ ==="
            val() { [ -f keystore/keystore.properties ] && grep -E "^$1=" keystore/keystore.properties | head -1 | cut -d= -f2- \
                    | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || true; }
            SP=$(val storePassword); KP=$(val keyPassword)
            AL=$(val keyAlias);      SF=$(val storeFile)

            # 把所有问题攒齐了一次报完，省得你修一个跑一次
            problems=""
            [ -f keystore/keystore.properties ] || problems="$problems 缺 keystore/keystore.properties"
            [ -n "$SP" ] || problems="$problems storePassword 为空"
            [ -n "$KP" ] || problems="$problems keyPassword 为空"
            [ -n "$AL" ] || problems="$problems keyAlias 为空"
            if [ -z "$SF" ]; then
              SF="wesdtf698.jks"
              echo "  storeFile 未写，按默认 $SF 处理"
            fi
            if [ ! -f "keystore/$SF" ]; then
              # 文件名被改过也认：扫目录里任何 keystore 类文件自动顶上
              found=$(ls keystore/*.jks keystore/*.keystore keystore/*.p12 keystore/*.pfx 2>/dev/null | head -1)
              if [ -n "$found" ]; then
                echo "  ⚠ storeFile='$SF' 不存在，改用目录里实际找到的 $(basename "$found")"
                SF=$(basename "$found")
              else
                problems="$problems 找不到 keystore/$SF（jks 没提交上来）"
              fi
            fi
            if [ -n "$problems" ]; then
              echo "::error::仓库内置签名配置不完整：$problems"
              echo ""
              echo "  最小改动：打开 keystore/keystore.properties，把这两行等号后面补上口令并保存"
              echo "      storePassword=你的库口令"
              echo "      keyPassword=你的私钥口令（JKS 里通常和上面一样）"
              echo "  若 keystore/wesdtf698.jks 也不在仓库里，说明它没被提交，需要一并加上"
              exit 1
            fi
            check_jks "keystore/$SF" "仓库内置 keystore" || exit 1
            check_alias "keystore/$SF" "$AL" || exit 1
            echo "  口令已检测到（内容不打印）"


          else
            echo "::error::没有可用签名：既没有 secret KEYSTORE_BASE64，仓库里也没有 keystore/keystore.properties"
            echo "  两条路任选一条："
            echo "  A) 仓库 Settings → Secrets and variables → Actions → Repository secrets 建四项："
            echo "     KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD（名称区分大小写）"
            echo "  B) 把 keystore/keystore.properties 里的 storePassword、keyPassword 两格填上口令"
            echo ""
            echo "  只想先验证代码能否编译：Run workflow 时把 build_type 选成 debug（不碰签名）"
            exit 1
          fi
          echo "keystore 就绪"



      # 找出「同一个顶层类被声明了两遍」的文件对。
      # 覆盖复制粘贴时产生的 (1)/2 副本、扁平命名副本、以及文件被追加成两份的情况，
      # 这三种都会让编译器报一大片 Conflicting overloads，但错误信息从不告诉你多出来的是哪个文件。
      - name: Detect duplicated declarations
        run: |
          set -uo pipefail
          report=$(grep -rlE "^(data class|sealed class|enum class|abstract class|open class|class|object|interface) " \
                     --include="*.kt" app/src/main/java 2>/dev/null \
                   | while read -r f; do
                       grep -oE "^(data class|sealed class|enum class|abstract class|open class|class|object|interface) [A-Za-z0-9_]+" "$f" \
                         | awk -v F="$f" '{print $NF"\t"F}'
                     done \
                   | sort | awk -F'\t' 'p==$1{print "  "p": "prev"  <->  "$2} {p=$1;prev=$2}')
          if [ -n "$report" ]; then
            echo "::error::发现重复声明的类，请删除多余的那一份文件"
            printf '%s\n' "$report"
            exit 1
          fi
          echo "未发现重复声明"

      # 上一轮我给过文件名里带 __ 的扁平副本（为了绕开 .github 隐藏目录），
      # 那种文件如果被复制进源码目录，同一个包内就会出现两份同名函数，
      # 报 Overload resolution ambiguity —— 而且编译器不会告诉你是哪个文件多余。
      # 这里直接点名，避免你再靠猜去删。
      - name: Guard duplicated flat-named sources
        run: |
          set -uo pipefail
          bad=$(find . -path './.git' -prune -o -type f \( -name '*__*.kt' -o -name '*__*.yml' \) -print 2>/dev/null | head -20)
          if [ -n "$bad" ]; then
            echo "::error::仓库里有扁平命名的源码副本，会造成重复声明，请把下面这些全部删除"
            printf '%s\n' "$bad"
            echo "（正确文件名不带 __，例如 SettingQingshuiFeaturesPage.kt，不是 app__src__...__SettingQingshuiFeaturesPage.kt）"
            exit 1
          fi
          echo "没有扁平命名副本"

      # 自动修补已知的两处可空接收者写法。
      # 幂等：文件已经是修复版时 sed 匹配不到，什么都不改；是旧版时当场补上，
      # 并把差异打进日志 —— 这样既能直接构建通过，也能一眼看出仓库里到底是哪个版本。
      - name: Patch known nullable-receiver sites
        if: inputs.build_type != 'debug'
        run: |
          set -uo pipefail
          F="app/src/main/java/me/rerere/rikkahub/data/qqbot/QQBotSocketClient.kt"
          [ -f "$F" ] || { echo "没有 $F，跳过"; exit 0; }
          cp "$F" /tmp/before.kt
          sed -i 's/\r$//' "$F"
          # 1) json["message"] 为 null 时会落进 when 的 else，else 里 raw.jsonArray 就成了可空调用
          sed -i -E 's|^([[:space:]]*)val raw = json\["message"\][[:space:]]*$|\1val raw = json["message"] ?: return null|' "$F"
          # 2) ?. 链结果是 String?，isNotBlank() 需要非空
          sed -i -E 's|^([[:space:]]*)val name = seg\["data"\]\?\.jsonObject\?\.stringish\("name"\)$|\1val name = seg["data"]?.jsonObject?.stringish("name").orEmpty()|' "$F"
          if cmp -s /tmp/before.kt "$F"; then
            echo "仓库里的文件已经是修复版，无需修补"
          else
            echo "⚠ 仓库里是旧版，已自动修补以下两行："
            diff /tmp/before.kt "$F" || true
          fi

      # --no-configuration-cache 必须加：签名配置在 Gradle 配置阶段求值，而 setup-gradle
      # 会缓存 ~/.gradle（含 configuration cache）。不加这个参数，一旦第一次构建时
      # secret 还没配好，缓存里就固化了「用 debug 签名」的结果，后面 secret 配对也可能不生效。
      - name: Build Release APK
        if: inputs.build_type != 'debug'
        env:
          QINGSHUI_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          QINGSHUI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          QINGSHUI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-configuration-cache --stacktrace 2>&1 | tee /tmp/build.log

      # 验收：产物必须是自己的证书。debug 签名或指纹不符一律判失败——
      # 这种包文件名看着是 release，装上去却会跟旧版本签名冲突、覆盖安装失败，很难查。
      - name: Verify release signature
        if: inputs.build_type != 'debug'
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || APKSIGNER=$(find /usr/lib/android-sdk /usr/local/lib/android/sdk -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"

          WANT=$(printf '%s' "${{ inputs.expected_sha256 }}" | tr -d ' :' | tr 'a-f' 'A-F')
          FAILED=0
          shopt -s nullglob
          APKList=(app/build/outputs/apk/release/*.apk)
          [ ${#APKList[@]} -gt 0 ] || { echo "::error::没有 release APK 产物"; exit 1; }

          for APK in "${APKList[@]}"; do
            echo "---------- 检查 $(basename "$APK") ----------"
            "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/cert.txt

            if grep -qi "CN=Android Debug" /tmp/cert.txt; then
              echo "::error::$(basename "$APK") 是 debug 签名，正式签名没生效"
              FAILED=1
              continue
            fi

            GOT=$(grep -i "certificate SHA-256 digest" /tmp/cert.txt | sed 's/.*: //' | tr -d ' :' | tr 'a-f' 'A-F')
            if [ -n "$WANT" ] && [ "$GOT" != "$WANT" ]; then
              echo "::error::$(basename "$APK") 指纹不符  实际=$GOT  预期=$WANT"
              FAILED=1
            else
              echo "签名指纹匹配：$GOT"
            fi
          done

          [ "$FAILED" -eq 0 ] || { echo "签名验收未通过"; exit 1; }
          echo "正式签名验收通过"

      - name: Build Debug APK
        if: inputs.build_type != 'release'
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-configuration-cache --stacktrace 2>&1 | tee /tmp/build-debug.log

      # 把 Kotlin 编译错误转成 GitHub annotation：点开工作流就能看到具体文件与行号，
      # 不用下载整份日志再逐行找 e: 开头的行。
      - name: Report compile errors
        if: failure()
        run: |
          for log in /tmp/build.log /tmp/build-debug.log; do
            [ -f "$log" ] || continue
            # Gradle 9 输出的是仓库相对路径（e: app/src/.../File.kt:209:49 msg），
            # 旧版是 file:/// 绝对路径；两种都要吃，否则 annotation 只有消息没有位置。
            grep -aoE "e: (file://)?[^ ]+\.kt:[0-9]+:[0-9]+ .*" "$log" | head -40 | while IFS= read -r line; do
              file=$(printf '%s' "$line" | sed -E 's|^e: (file://)?||; s|^/home/runner/work/[^/]+/[^/]+/||; s|\.kt:.*|.kt|')
              ln=$(printf '%s' "$line" | sed -E 's|.*\.kt:([0-9]+):[0-9]+ .*|\1|')
              col=$(printf '%s' "$line" | sed -E 's|.*\.kt:[0-9]+:([0-9]+) .*|\1|')
              msg=$(printf '%s' "$line" | sed -E 's|.*\.kt:[0-9]+:[0-9]+ ||' | tr -d '\r' | cut -c1-300)
              echo "::error file=$file,line=$ln,col=$col,title=Kotlin 编译错误::$msg"
            done
            grep -E "^\* What went wrong:" -A 6 "$log" | head -12 || true
          done

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in release debug; do
            d="app/build/outputs/apk/$dir"
            [ -d "$d" ] || continue
            for f in "$d"/*.apk; do
              [ -e "$f" ] || continue
              # 文件名带构建类型，避免 release/debug 同名文件互相覆盖
              cp "$f" "out/${dir}-$(basename "$f")"
            done
          done
          echo "=== 产物 ==="
          ls -lh out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: qingshui-apk-${{ inputs.build_type }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
